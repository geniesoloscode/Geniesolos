<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>GenieSolos icon</title>
<style>
  html, body { margin: 0; padding: 0; width: 512px; height: 512px; overflow: hidden; }
  svg { display: block; }
</style></head>
<body>
<!--
  Stripe icon: 512x512, square, solid so it never depends on the surface
  behind it. The glyph sits well inside the tile (about 25% padding) so it
  survives being cropped to a circle, which several Stripe surfaces do.
-->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="96" fill="#7C3AED"/>
  <!-- the nav mark, scaled 9x and centred on the hexagon's own centre (16,17) -->
  <g transform="translate(112,103) scale(9)">
    <path d="M16 2 29 9.5v15L16 32 3 24.5v-15Z"
          fill="none" stroke="#FAF5EC" stroke-width="2" stroke-linejoin="round"/>
    <path d="M16 9v7l6 3.5"
          fill="none" stroke="#FAF5EC" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="16" cy="16" r="2.1" fill="#FAF5EC"/>
  </g>
</svg>
</body></html>
