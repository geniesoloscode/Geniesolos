name: Deploy to S3 + CloudFront

# Publishes the site to geniesolos.com on every push to main.
#
# Authentication is OIDC role assumption, not stored keys: GitHub mints a
# short-lived token, AWS trades it for temporary credentials, and the trust
# policy only accepts tokens from this repo's main branch. There are no AWS
# secrets in this repository.

on:
  push:
    branches: [main]
    # Skip runs that cannot change what is served
    paths-ignore:
      - 'card/**'
      - '**/*.md'
      - '.gitignore'
  workflow_dispatch:

# Never let two deploys race to overwrite the bucket
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write      # required to request the OIDC token
  contents: read

env:
  AWS_REGION: us-east-1
  BUCKET: geniesolos-com-site
  DISTRIBUTION_ID: E13HIX0DOKUMO1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The trust policy matches GitHub's immutable-ID subject claim,
      #   repo:geniesolostech@311596157/Geniesolos@1323093297:ref:refs/heads/main
      # not the name-only form. Both are allowed; if this repo is ever
      # transferred or renamed, the numeric IDs are what keep working.
      - name: Assume deploy role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::612722076912:role/geniesolos-site-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Static assets: cached hard at the edge and in browsers. Safe because
      # the invalidation below clears the edge on every deploy.
      - name: Sync assets
        run: |
          # Default-DENY: exclude everything, then add back only site paths.
          # A blacklist published anything new in the repo unless someone
          # remembered to exclude it. Order matters - "*" must come first.
          # Keep identical to $SyncFilters in scripts/deploy.ps1; both run
          # --delete, so divergence makes each undo the other.
          #
          # terms/* is the archive of dated service-terms versions: each file
          # is immutable once cut and is what a customer's checkout consent
          # record points at, so it has to be served, not just committed.
          aws s3 sync . "s3://$BUCKET" --delete \
            --exclude "*" \
            --include "css/*" \
            --include "js/*" \
            --include "assets/*" \
            --include "terms/*" \
            --include "robots.txt" \
            --include "sitemap.xml" \
            --cache-control "public, max-age=300, s-maxage=604800"

      # HTML last, and always revalidated, so a browser never pairs a new
      # stylesheet with a stale document.
      - name: Upload HTML
        run: |
          for f in index.html 404.html terms.html store.html privacy.html; do
            aws s3 cp "$f" "s3://$BUCKET/$f" \
              --cache-control "public, max-age=0, must-revalidate" \
              --content-type "text/html; charset=utf-8"
          done
          # Clean-URL copy: S3 has no rewrite rules, the object key IS the
          # URL, so /terms only works if an object named "terms" exists.
          # Keep identical to the extensionless upload in scripts/deploy.ps1.
          aws s3 cp terms.html "s3://$BUCKET/terms" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/html; charset=utf-8"
          # Clean-URL copy for the store, same reasoning as terms above.
          aws s3 cp store.html "s3://$BUCKET/store" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/html; charset=utf-8"
          # Clean-URL copy for the privacy policy, same reasoning as terms.
          aws s3 cp privacy.html "s3://$BUCKET/privacy" \
            --cache-control "public, max-age=0, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" --query 'Invalidation.Id' --output text)
          echo "Invalidation $ID created"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" --id "$ID"
          echo "Invalidation complete"

      - name: Verify the live site
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' https://geniesolos.com/)
          echo "https://geniesolos.com/ -> $CODE"
          test "$CODE" = "200"
