<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found | GenieSolos Tech</title>
<meta name="description" content="That page is not here. The portfolio, the store, and the service documents all are.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#FAF5EC" id="themeColor">

<!-- Applies the saved theme before first paint. Inline and above the
     stylesheet on purpose: anything deferred lets a dark-theme visitor
     eat a full-screen cream flash on every page load. -->
<script>
(function () {
  var pick = null;
  var q = /[?&]theme=(dark|light)\b/.exec(location.search);   // shareable / testable
  if (q) { pick = q[1]; }
  else {
    try { pick = localStorage.getItem('gs-theme'); } catch (e) { /* private mode */ }
  }
  if (pick === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
    var m = document.getElementById('themeColor');
    if (m) m.setAttribute('content', '#060807');
  }
})();
</script>

<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/favicon.svg">

<!-- Self-hosted: no request leaves this origin. See css/fonts.css. The body
     face is preloaded because every page uses it for all running text. -->
<link rel="preload" href="/assets/fonts/space-grotesk-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/fonts.css?v=20260817">
<link rel="stylesheet" href="/css/style.css?v=20260817">
</head>

    </p>

      </a>
      <a class="btn btn--ghost" href="/store"><span>Browse the store</span></a>
    </p>

    <p class="nf__links">
      <a href="/terms">Service Terms</a><span aria-hidden="true">&middot;</span><a href="/privacy">Privacy Policy</a><span aria-hidden="true">&middot;</span><a href="mailto:geniesolostech@gmail.com">Email us</a>
    </p>
