<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GenieSolos OG card</title>

<!-- Source of truth for assets/og-card.png. Edit here, then run
     scripts/build-og.ps1 to re-export. Never hand-edit the PNG:
     the text in it has to stay in sync with index.html's meta tags. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<style>
  /* Palette lifted verbatim from css/style.css :root so the card can
     never drift from the site it represents. */
  :root {
    --cream:         #FAF5EC;
    --ink:           #292437;
    --green:         #17A15E;
    --green-deep:    #0C7A46;
    --green-bright:  #2ED47F;
    --sun:           #FFC933;
    --amber:         #F0A31A;
    --violet:        #7C3AED;
    --violet-bright: #A78BFA;
    --muted:         #6E6680;
    --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    --sans: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1200px; height: 630px; }

  body {
    position: relative; overflow: hidden;
    background: var(--cream);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  /* Soft colour fields, matching the site's "sunroom" art direction.
     Blurred radials rather than images so the file stays dependency-free. */
  .glow { position: absolute; border-radius: 50%; filter: blur(4px); }
  .glow--sun    { width: 620px; height: 620px; top: -250px; right: -120px;
                  background: radial-gradient(circle, rgba(255,201,51,.42), rgba(255,201,51,0) 68%); }
  .glow--violet { width: 560px; height: 560px; top: 180px;  right: -170px;
                  background: radial-gradient(circle, rgba(167,139,250,.40), rgba(167,139,250,0) 68%); }
  .glow--green  { width: 520px; height: 520px; bottom: -260px; left: -150px;
                  background: radial-gradient(circle, rgba(46,212,127,.30), rgba(46,212,127,0) 68%); }
  .glow--lilac  { width: 420px; height: 420px; bottom: -200px; right: 120px;
                  background: radial-gradient(circle, rgba(167,139,250,.30), rgba(167,139,250,0) 70%); }

  /* Brand rule across the top edge. */
  .bar {
    position: absolute; inset: 0 0 auto 0; height: 9px;
    background: linear-gradient(90deg,
      var(--green-bright) 0%, #17A15E 14%, #1FB392 34%,
      #2E9BD4 52%, #4F7BE8 72%, var(--violet) 100%);
  }

  .body { position: relative; padding: 96px 0 0 80px; }

  .kicker {
    font-family: var(--mono); font-weight: 700; font-size: 19px;
    letter-spacing: .22em; color: var(--violet);
  }

  .name {
    margin-top: 34px;
    font-size: 104px; font-weight: 700; line-height: .94;
    letter-spacing: -.022em; color: var(--ink);
  }
  /* Second line carries the brand ramp, same treatment as the hero H1. */
  .name .accent {
    background: linear-gradient(100deg, var(--green) 0%, #12A98C 42%, #2E7BE0 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  .role {
    margin-top: 30px;
    font-family: var(--mono); font-weight: 400; font-size: 21px;
    letter-spacing: .01em; color: var(--ink);
  }
  .role .sep { padding: 0 10px; color: var(--muted); }

  .creds {
    margin-top: 22px; display: flex; align-items: center;
    font-family: var(--mono); font-weight: 500; font-size: 21px;
    color: var(--green-deep);
  }
  /* CISSP gets the amber highlight it has on the live site. */
  .creds .mark {
    background: var(--sun); color: #4A3200;
    font-weight: 700; padding: 3px 11px; border-radius: 5px;
  }
  .creds .dot { padding: 0 12px; color: var(--muted); }

  .rule {
    position: absolute; left: 80px; right: 80px; top: 524px;
    height: 1px; background: rgba(41, 36, 55, .14);
  }

  .url {
    position: absolute; left: 80px; top: 546px;
    font-family: var(--mono); font-weight: 500; font-size: 20px;
    letter-spacing: .015em; color: var(--muted);
  }

  .mark-hex { position: absolute; top: 182px; right: 108px; }
</style>
</head>
<body>
  <div class="bar"></div>
  <div class="glow glow--sun"></div>
  <div class="glow glow--violet"></div>
  <div class="glow glow--green"></div>
  <div class="glow glow--lilac"></div>

  <!-- Nested hexagons + core: the GenieSolos mark. -->
  <svg class="mark-hex" width="242" height="242" viewBox="0 0 242 242" aria-hidden="true">
    <polygon points="121,1 225,61 225,181 121,241 17,181 17,61"
             fill="none" stroke="#7C3AED" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="121,57 185,94 185,168 121,205 57,168 57,94"
             fill="none" stroke="#17A15E" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="121" cy="131" r="12" fill="#FFC933"/>
  </svg>

  <div class="body">
    <p class="kicker">GENIESOLOS</p>
    <h1 class="name">Gene<br><span class="accent">Garland</span></h1>
    <p class="role">Systems Engineer<span class="sep">·</span>U.S. Federal Government</p>
    <p class="creds">
      <span class="mark">CISSP</span>
      <span class="dot">·</span>M.S. Cybersecurity
      <span class="dot">·</span>Secret Clearance
      <span class="dot">·</span>10+ Years Engineering
    </p>
  </div>

  <div class="rule"></div>
  <p class="url">geniesolos.com</p>
</body>
</html>
